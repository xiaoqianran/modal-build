name: GLM53 DFlash Warmup Verify

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Install Modal CLI
        run: uv tool install 'modal==1.5.5'
      - name: Checkout GLM repo
        uses: actions/checkout@v7.0.1
        with:
          repository: xiaoqianran/modal-glm53-flash-dflash2-gb300
          ref: main
          path: glm
      - name: DFlash2 warmed benchmark
        run: modal run glm/modal_serve.py --action benchmark --mode dflash2 2>&1 | tee dflash2-warmup-verify.log
      - name: Deploy formal scale-to-zero server
        run: modal deploy glm/modal_serve.py | tee deploy-warmup-verify.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: glm53-dflash-warmup-verify-logs
          path: |
            *.log
          if-no-files-found: warn